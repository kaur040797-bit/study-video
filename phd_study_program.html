<div id="app" style="max-width:680px;margin:0 auto;font-family:system-ui,-apple-system,sans-serif;line-height:1.6;color:#222;padding:24px 16px 60px;"></div>

<style>
  #app button { cursor:pointer; }
  .card { background:#fff; border:1px solid #e2e2e2; border-radius:10px; padding:24px; margin-bottom:16px; }
  .btn { display:inline-block; padding:10px 20px; border-radius:6px; border:1px solid #333; background:#222; color:#fff; font-size:15px; }
  .btn:disabled { opacity:0.4; cursor:not-allowed; }
  .btn-secondary { background:#fff; color:#222; }
  .likert { display:flex; gap:5px; margin-top:8px; flex-wrap:wrap; }
  .likert button { flex:1; min-width:36px; padding:7px 3px; border-radius:6px; border:1px solid #ccc; background:#fafafa; font-size:12px; }
  .likert button.selected { background:#222; color:#fff; border-color:#222; }
  .progressbar { height:4px; background:#eee; border-radius:2px; margin-bottom:24px; overflow:hidden; }
  .progressfill { height:100%; background:#333; transition:width .3s; }
  textarea { width:100%; min-height:110px; padding:10px; border-radius:6px; border:1px solid #ccc; font-family:inherit; font-size:14px; box-sizing:border-box; }
  .chatbox { border:1px solid #ddd; border-radius:8px; height:320px; overflow-y:auto; padding:12px; background:#fafafa; margin-bottom:10px; }
  .msg { margin-bottom:10px; padding:8px 12px; border-radius:12px; max-width:80%; font-size:14px; }
  .msg.user { background:#222; color:#fff; margin-left:auto; }
  .msg.ai { background:#fff; border:1px solid #ddd; }
  .chatinput { display:flex; gap:8px; }
  .chatinput input { flex:1; padding:10px; border-radius:6px; border:1px solid #ccc; }
  .note { font-size:13px; color:#888; margin-top:6px; }
  .flag { background:#fff8e1; border:1px solid #ffe082; border-radius:6px; padding:10px 12px; font-size:13px; margin-bottom:16px; }
  video { width:100%; border-radius:8px; background:#000; }
  .paqrow { display:grid; grid-template-columns: 1fr auto auto; gap:10px; align-items:center; padding:10px 0; border-bottom:1px solid #eee; font-size:14px; }
  .paqhead { font-weight:600; font-size:12px; color:#666; text-align:center; }
  .miniselect { display:flex; gap:3px; }
  .miniselect button { width:26px; height:26px; border-radius:5px; border:1px solid #ccc; background:#fafafa; font-size:11px; }
  .miniselect button.selected { background:#222; color:#fff; border-color:#222; }
  .exportbar { max-width:680px; margin:20px auto; text-align:center; }
  .exportbar button { background:none; border:1px solid #ccc; border-radius:6px; padding:8px 14px; font-size:12px; color:#666; cursor:pointer; }
</style>

<script>
(function(){
  const root = document.getElementById('app');
  const SID = 'p_' + Math.random().toString(36).slice(2,10) + '_' + Date.now();

  // ====================================================================
  // VIDEO SOURCE CONFIG
  // The sandboxed chat preview cannot see sibling files in the outputs
  // folder, so a relative path like "stress_video.mp4" will not load
  // inside the in-chat preview. It WILL work once you:
  //   (a) download this HTML file and the video file to the same local
  //       folder and open the HTML file directly in a browser, or
  //   (b) host the video file somewhere with a real URL (Google Drive
  //       direct link, GitHub Pages, your university server, or
  //       directly inside Gorilla/PsyToolkit) and paste that URL below.
  // ====================================================================
  const VIDEO_SRC = "https://raw.githubusercontent.com/kaur040797-bit/study-video/main/stress_video.mp4"; // hosted on GitHub

  // ============ INSTRUMENTS ============

  const RYFF_ITEMS = [
    "I am not afraid to voice my opinions, even when they are in opposition to the opinions of most people.",
    "For me, life has been a continuous process of learning, changing, and growth.",
    "In general, I feel I am in charge of the situation in which I live.",
    "People would describe me as a giving person, willing to share my time with others.",
    "I am not interested in activities that will expand my horizons.",
    "I enjoy making plans for the future and working to make them a reality.",
    "Most people see me as loving and affectionate.",
    "In many ways I feel disappointed about my achievements in life.",
    "I live life one day at a time and don't really think about the future.",
    "I tend to worry about what other people think of me.",
    "When I look at the story of my life, I am pleased with how things have turned out.",
    "I have difficulty arranging my life in a way that is satisfying to me.",
    "My decisions are not usually influenced by what everyone else is doing.",
    "I gave up trying to make big improvements or changes in my life a long time ago.",
    "The demands of everyday life often get me down.",
    "I have not experienced many warm and trusting relationships with others.",
    "I think it is important to have new experiences that challenge how you think about yourself and the world.",
    "Maintaining close relationships has been difficult and frustrating for me.",
    "My attitude about myself is probably not as positive as most people feel about themselves.",
    "I have a sense of direction and purpose in life.",
    "I judge myself by what I think is important, not by the values of what others think is important.",
    "In general, I feel confident and positive about myself.",
    "I have been able to build a living environment and a lifestyle for myself that is much to my liking.",
    "I tend to be influenced by people with strong opinions.",
    "I do not enjoy being in new situations that require me to change my old familiar ways of doing things.",
    "I do not fit very well with the people and the community around me.",
    "I know that I can trust my friends, and they know they can trust me.",
    "When I think about it, I haven't really improved much as a person over the years.",
    "Some people wander aimlessly through life, but I am not one of them.",
    "I often feel lonely because I have few close friends with whom to share my concerns.",
    "When I compare myself to friends and acquaintances, it makes me feel good about who I am.",
    "I don't have a good sense of what it is I'm trying to accomplish in life.",
    "I sometimes feel as if I've done all there is to do in life.",
    "I feel like many of the people I know have gotten more out of life than I have.",
    "I have confidence in my opinions, even if they are contrary to the general consensus.",
    "I am quite good at managing the many responsibilities of my daily life.",
    "I have the sense that I have developed a lot as a person over time.",
    "I enjoy personal and mutual conversations with family members and friends.",
    "My daily activities often seem trivial and unimportant to me.",
    "I like most parts of my personality.",
    "It's difficult for me to voice my own opinions on controversial matters.",
    "I often feel overwhelmed by my responsibilities."
  ];
  const RYFF_REVERSE_1INDEXED = [1,2,3,4,6,7,11,13,17,20,21,22,23,27,29,31,35,36,37,38,40];
  const RYFF_LABELS = ["Strongly agree","Somewhat agree","A little agree","Neither agree nor disagree","A little disagree","Somewhat disagree","Strongly disagree"];

  const PAQ_ITEMS = [
    "Does whatever I tell.","Spends free time with me.","Points out my mistakes in the manner that I understand.",
    "Gives money for my needs.","Discusses the benefits and detriments of my learning topics.","Considers my likes in food.",
    "Controls my game when in excess.","Shows love to me.","Enquires the reason for my failure.","Helps me in studying.",
    "Confers responsibilities in accordance with my growth.","Has faith in me.","Enquires the reasons for reaching home late.",
    "Accepts my privacy.","Takes care of my dressing.","Fulfils my desires with available means.",
    "Makes me aware that the responsibility of what I do is mine itself.","Accepts when I say no to what I dislike.",
    "Tells how I should behave with their friends.","Talks to me praising about their friends.","Tries to frame my likes and dislikes.",
    "Appreciates when I try to become independent.","Punishes for my mistakes.","Shows love when I do any mistake.",
    "Enquires who my friends are.","Has given me freedom to select the subject for study.","Organizes time for my play.",
    "Gives priorities to my preferences in studies.","Demands me to be systematic in studies.","Emphasizes my successes.",
    "Advices me.","Celebrates in my successes with me.","Discourages unhealthy foods.","Gets anxious when I am late to reach home.",
    "Inquires how I spend money.","Buy dresses for me according to the latest trends.","Enquires how I spend my free time.",
    "Gives me timely advices."
  ];
  const PAQ_LABELS = ["Very wrong","Mostly wrong","Sometimes right/wrong","Mostly right","Very right"];

  // PLACEHOLDER ITEM TEXT ONLY - the real STAI Form Y-1 (State) wording is
  // copyrighted and licensed through Mind Garden; swap these 20 lines for
  // the licensed wording once you have it. The item COUNT, ORDER, response
  // scale, and STAI_REVERSE flags below already match the official Mind
  // Garden STAIP-AD Form Y-1 scoring key exactly, so total scores will be
  // correct the moment the licensed text goes in - no other code changes
  // needed. This is administered twice (baseline + post-video) to capture
  // the change in state anxiety caused by the video, which is standard for
  // Form Y-1; Form Y-2 (Trait) is a separate 20-item instrument that
  // measures general disposition rather than a momentary reaction, so it
  // isn't included here - say the word if you also want a one-time Trait
  // measure added as a covariate.
  const STAI_ITEMS = [
    "Placeholder item 1", "Placeholder item 2", "Placeholder item 3", "Placeholder item 4",
    "Placeholder item 5", "Placeholder item 6", "Placeholder item 7", "Placeholder item 8",
    "Placeholder item 9", "Placeholder item 10", "Placeholder item 11", "Placeholder item 12",
    "Placeholder item 13", "Placeholder item 14", "Placeholder item 15", "Placeholder item 16",
    "Placeholder item 17", "Placeholder item 18", "Placeholder item 19", "Placeholder item 20"
  ];
  // true = reverse-scored (weight = 5 - response), matching Form Y-1 items
  // 1,2,5,8,10,11,15,16,19,20 in the Mind Garden scoring key you shared.
  const STAI_REVERSE = [
    true, true, false, false, true, false, false, true, false, true,
    true, false, false, false, true, true, false, false, true, true
  ];
  // Official scale is 4-point, not 5-point: Not at all(1) / Somewhat(2) /
  // Moderately so(3) / Very much so(4). The previous version of this file
  // had an extra "Extremely so" option that isn't part of the real
  // instrument and would have thrown off comparability with published norms.
  const LIKERT_STAI = ["Not at all","Somewhat","Moderately so","Very much so"];

  const AI_SYSTEM_PROMPT = `You are a warm, supportive companion. The participant has just watched a short video clip as part of a research study and may want to talk about how it made them feel.
Guidelines:
- Keep replies to 1-3 short, conversational sentences.
- Focus on the video and the participant's reaction to it - use active listening, reflect feelings back, ask open-ended follow-up questions, and validate what they share.
- Do not offer unsolicited advice unless directly asked.
- Do not mention you are an AI unless explicitly asked "are you an AI?" - if asked, answer honestly and briefly, then continue supporting them.
- Do not steer the conversation toward career, family, friendships, or academic grades unless the participant brings these up first.
- If the person expresses thoughts of self-harm or crisis, respond with care and gently encourage them to reach out to a counselor or helpline immediately.
- Maintain a calm, patient, non-judgmental tone throughout - no exclamation points, no emojis.
- Ask at most one question per response.`;

  // ============ STATE ============
  let state = {
    screen: 'consent',
    usesAI: null,
    ryff: Array(RYFF_ITEMS.length).fill(null),
    paqMother: Array(PAQ_ITEMS.length).fill(null),
    paqFather: Array(PAQ_ITEMS.length).fill(null),
    stai1: Array(STAI_ITEMS.length).fill(null),
    stai2: Array(STAI_ITEMS.length).fill(null),
    condition: null,
    chatLog: [],
    note: '',
    log: { t_start: Date.now() }
  };

  // ============ STORAGE ============
  // Every completed section calls persist(), which writes the FULL current
  // state (all answers so far + timestamps) to window.storage under a key
  // unique to this participant's session. This means:
  //  - progress is saved continuously, not just at the very end
  //  - if the browser closes mid-session, whatever was completed is not lost
  //  - each participant's data is stored under their own session key,
  //    namespaced as "session:<random id>", so sessions never overwrite
  //    each other
  async function persist() {
    try {
      const result = await window.storage.set('session:' + SID, JSON.stringify(state), false);
      if (!result) console.error('Storage write returned no result');
    } catch(e) {
      console.error('Storage write failed:', e);
    }
  }

  function render() {
    root.innerHTML = '';
    const screens = ['consent','age_screen','ai_screen','ryff','paq','stai1','video','stai2','choice','ai_chat','note','debrief'];
    const idx = screens.indexOf(state.screen);
    const prog = document.createElement('div');
    prog.className = 'progressbar';
    prog.innerHTML = `<div class="progressfill" style="width:${(idx/(screens.length-1))*100}%"></div>`;
    root.appendChild(prog);
    const card = document.createElement('div');
    card.className = 'card';
    root.appendChild(card);

    if (state.screen === 'consent') renderConsent(card);
    else if (state.screen === 'age_screen') renderAgeScreen(card);
    else if (state.screen === 'ai_screen') renderAIScreen(card);
    else if (state.screen === 'ryff') renderRyff(card);
    else if (state.screen === 'paq') renderPAQ(card);
    else if (state.screen === 'stai1') renderSTAI(card, 'stai1', 'How you feel right now (baseline)', 'video');
    else if (state.screen === 'video') renderVideo(card);
    else if (state.screen === 'stai2') renderSTAI(card, 'stai2', 'How you feel right now (after the video)', 'choice');
    else if (state.screen === 'choice') renderChoice(card);
    else if (state.screen === 'ai_chat') renderChat(card);
    else if (state.screen === 'note') renderNote(card);
    else if (state.screen === 'debrief') renderDebrief(card);
  }

  function renderConsent(card) {
    card.innerHTML = `
      <h2>Informed Consent Form</h2>
      <p style="font-weight:600;">Parenting Style, Stress, and Coping Resource Selection Among Young Adults</p>
      <p class="note">Punjabi University, Patiala</p>
      <div style="max-height:420px;overflow-y:auto;border:1px solid #ddd;border-radius:8px;padding:16px;background:#fafafa;font-size:14px;line-height:1.7;">
        <p><strong>Researcher:</strong> [Ramandeep Kaur], Ph.D. Candidate, [Psychology]<br/>
        <strong>Supervisor:</strong> [Dr. Tarika Sandhu]<br/>
        <strong>Contact:</strong> [kaur040797@gmail.com] | </p>

        <p>You are invited to take part in a research study on how young adults respond to stress and choose sources of support. This form follows the ethical guidelines of the American Psychological Association (APA Ethics Code, Standard 8.02, Informed Consent to Research) and describes the purpose, procedures, risks, and your rights as a participant.</p>

        <p><strong>Purpose.</strong> This study examines how personal background and stress responses relate to the way people choose to cope.</p>

        <p><strong>Procedure.</strong> You will:</p>
        <ul>
          <li>Complete brief questionnaires about your upbringing, wellbeing, and current mood.</li>
          <li>Watch a short video clip.</li>
          <li>Answer brief mood questions before and after the clip.</li>
          <li>Choose to either chat briefly with an AI companion or write a private note about how you feel.</li>
          <li>Complete a short final questionnaire.</li>
        </ul>
        <p>Estimated duration: [X] minutes.</p>

        <p><strong>Partial disclosure.</strong> One part of this study is described only in general terms until after your participation. The full explanation will be provided immediately afterward, and you may withdraw your data at that point if you wish. This approach is necessary for the scientific validity of the study and is a standard, ethically reviewed practice.</p>

        <p><strong>Voluntary participation.</strong> Participation is voluntary. You may skip any question or withdraw at any time without penalty. Data from a withdrawn session will not be used.</p>

        <p><strong>Risks.</strong> The video clip is designed to bring on brief, mild tension, a standard technique in stress research. No lasting distress is expected, and a calming activity follows every session.</p>

        <p><strong>Confidentiality.</strong> Please note:</p>
        <ul>
          <li>Data is linked only to an anonymous code, never your name.</li>
          <li>If you chat with the AI companion, your messages are processed by [claude ai] to generate responses, and stored securely under your anonymous code.</li>
          <li>Data is stored on [secure server] and used only for this research and related publications, in which you will not be identifiable.</li>
          <li>Data is retained for [X years] per university policy, then destroyed.</li>
        </ul>

        <p><strong>Compensation.</strong> [ "None."]</p>

        <p><strong>Right to ask questions.</strong> Contact the researcher or supervisor above with any questions. For concerns about your rights as a participant, contact the Institutional Ethics Committee, Punjabi University, Patiala, at [IEC contact].</p>

        <p><strong>Support resources.</strong> [University counselling service] | [Helpline name and number]</p>

        <p><strong>Consent.</strong> By proceeding, I confirm that: I have read and understood this form; I agree to take part on the basis that one part of the study will be fully explained only afterward; I understand my participation is voluntary and I may withdraw at any time; I understand how my data, including any AI chat messages, will be stored and used.</p>
      </div>

      <div style="margin-top:16px;">
        <label style="display:block;margin-bottom:8px;">Full name (acts as your signature): <br/>
          <input type="text" id="participantName" style="width:100%;padding:8px;border-radius:6px;border:1px solid #ccc;margin-top:4px;" placeholder="Type your full name"/>
        </label>
      </div>
      <label style="display:flex;gap:8px;align-items:center;margin-top:12px;">
        <input type="checkbox" id="consentCheck"/> I have read and understood this form, and I agree to take part on this basis.
      </label>
      <div style="color:#c0392b;font-size:13px;margin-top:6px;" id="consentErr"></div>
      <div style="margin-top:16px;"><button class="btn" id="startBtn">Begin</button></div>
    `;
    card.querySelector('#startBtn').addEventListener('click', ()=>{
      const name = card.querySelector('#participantName').value.trim();
      const checked = card.querySelector('#consentCheck').checked;
      const err = card.querySelector('#consentErr');
      if (!name) { err.textContent = 'Please type your full name.'; return; }
      if (!checked) { err.textContent = 'Please check the box confirming you agree to take part.'; return; }
      state.log.participant_name = name;
      state.log.consented_at = Date.now();
      state.screen = 'age_screen'; persist(); render();
    });
  }

  function renderAgeScreen(card) {
    card.innerHTML = `
      <h2>Eligibility check</h2>
      <p>This study is open to participants aged 18 to 22 years.</p>
      <label style="display:block;margin-bottom:8px;">What is your age?<br/>
        <input type="number" id="ageInput" min="1" max="120" style="width:100%;padding:8px;border-radius:6px;border:1px solid #ccc;margin-top:4px;" placeholder="Enter your age"/>
      </label>
      <div style="color:#c0392b;font-size:13px;margin-top:6px;" id="ageErr"></div>
      <button class="btn" id="ageContinueBtn" style="margin-top:14px;">Continue</button>
    `;
    card.querySelector('#ageContinueBtn').addEventListener('click', ()=>{
      const val = card.querySelector('#ageInput').value.trim();
      const err = card.querySelector('#ageErr');
      if (!val || isNaN(val)) { err.textContent = 'Please enter a valid age.'; return; }
      const age = parseInt(val, 10);
      state.log.age_entered = age;
      state.log.age_checked_at = Date.now();
      persist();
      if (age < 18 || age > 22) {
        state.log.excluded_at = Date.now();
        state.log.exclusion_reason = 'age_out_of_range';
        persist();
        card.innerHTML = `<h2>Thank you</h2><p>This study is open to participants aged 18 to 22 years. Based on the age you entered, you do not meet this criterion, so the study ends here. Thank you for your time.</p>`;
        return;
      }
      state.screen = 'ai_screen'; render();
    });
  }

  function renderAIScreen(card) {
    card.innerHTML = `
      <h2>Screening question</h2>
      <p>Do you use AI chatbots or AI tools (e.g. ChatGPT, Claude, Replika, Google Gemini) in your day-to-day life?</p>
      <div style="display:flex;gap:12px;margin-top:14px;">
        <button class="btn" id="yesBtn">Yes</button>
        <button class="btn btn-secondary" id="noBtn">No</button>
      </div>
    `;
    card.querySelector('#yesBtn').addEventListener('click', ()=>{
      state.usesAI = true; state.log.ai_screen_answered_at = Date.now();
      state.screen='ryff'; persist(); render();
    });
    card.querySelector('#noBtn').addEventListener('click', ()=>{
      state.usesAI = false; state.log.ai_screen_answered_at = Date.now();
      state.log.excluded_at = Date.now();
      persist();
      card.innerHTML = `<h2>Thank you</h2><p>This study requires participants who currently use AI tools in daily life. You do not meet this criterion, so the study ends here. Thank you for your time.</p>`;
    });
  }

  function renderRyff(card) {
    card.innerHTML = `<h2>Section 1: Wellbeing</h2><p class="note">Ryff Psychological Well-Being Scale (42-item form).</p>`;
    RYFF_ITEMS.forEach((text,i)=>{
      const block = document.createElement('div');
      block.style.marginBottom = '16px';
      block.innerHTML = `<div>${i+1}. ${text}</div>
        <div class="likert" data-i="${i}">${RYFF_LABELS.map((l,v)=>`<button data-v="${v}">${l}</button>`).join('')}</div>`;
      card.appendChild(block);
    });
    card.querySelectorAll('.likert').forEach(group=>{
      const i = +group.dataset.i;
      group.querySelectorAll('button').forEach(btn=>{
        btn.addEventListener('click', ()=>{
          state.ryff[i] = +btn.dataset.v;
          group.querySelectorAll('button').forEach(b=>b.classList.remove('selected'));
          btn.classList.add('selected'); persist();
        });
      });
    });
    const err = document.createElement('div');
    err.style.cssText='color:#c0392b;font-size:13px;margin-top:4px;';
    card.appendChild(err);
    const btn = document.createElement('button');
    btn.className='btn'; btn.textContent='Continue'; btn.style.marginTop='10px';
    btn.addEventListener('click', ()=>{
      if (state.ryff.some(v=>v===null)) { err.textContent='Please answer every item.'; return; }
      let subscales = {Autonomy:0, EnvironmentalMastery:0, PersonalGrowth:0, PositiveRelations:0, PurposeInLife:0, SelfAcceptance:0};
      const map = {
        Autonomy:[1,13,24,35,41,10,21], EnvironmentalMastery:[3,15,26,36,42,12,23],
        PersonalGrowth:[5,17,28,37,2,14,25], PositiveRelations:[7,18,30,38,4,16,27],
        PurposeInLife:[9,20,32,39,6,29,33], SelfAcceptance:[11,22,34,40,8,19,31]
      };
      const scored = state.ryff.map((v,idx)=>{
        let raw = v+1;
        if (RYFF_REVERSE_1INDEXED.includes(idx+1)) raw = 8 - raw;
        return raw;
      });
      Object.keys(map).forEach(k=>{ subscales[k] = map[k].reduce((s,itemNum)=> s + scored[itemNum-1], 0); });
      state.log.ryff_completed_at = Date.now();
      state.log.ryff_total = scored.reduce((a,b)=>a+b,0);
      state.log.ryff_subscales = subscales;
      state.screen='paq'; persist(); render();
    });
    card.appendChild(btn);
  }

  function renderPAQ(card) {
    card.innerHTML = `<h2>Section 2: Family background</h2>
      <p class="note">Gafoor &amp; Kurukkan (2014) Scale of Parenting Style. Rate your mother and father separately.</p>
      <div class="note" style="margin-bottom:16px;">
        <strong>What the numbers mean:</strong>
        <div style="display:grid;grid-template-columns:auto 1fr;gap:3px 8px;margin-top:6px;">
          ${PAQ_LABELS.map((l,v)=>`<span>${v+1}</span><span>${l}</span>`).join('')}
        </div>
      </div>
      <div class="paqrow"><div></div><div class="paqhead">Mother</div><div class="paqhead">Father</div></div>`;
    PAQ_ITEMS.forEach((text,i)=>{
      const row = document.createElement('div');
      row.className = 'paqrow';
      row.innerHTML = `<div>${i+1}. ${text}</div>
        <div class="miniselect" data-parent="mother" data-i="${i}">${[1,2,3,4,5].map(v=>`<button data-v="${v}" title="${PAQ_LABELS[v-1]}">${v}</button>`).join('')}</div>
        <div class="miniselect" data-parent="father" data-i="${i}">${[1,2,3,4,5].map(v=>`<button data-v="${v}" title="${PAQ_LABELS[v-1]}">${v}</button>`).join('')}</div>`;
      card.appendChild(row);
    });
    card.querySelectorAll('.miniselect').forEach(group=>{
      const i = +group.dataset.i, parent = group.dataset.parent;
      group.querySelectorAll('button').forEach(btn=>{
        btn.addEventListener('click', ()=>{
          if (parent==='mother') state.paqMother[i] = +btn.dataset.v; else state.paqFather[i] = +btn.dataset.v;
          group.querySelectorAll('button').forEach(b=>b.classList.remove('selected'));
          btn.classList.add('selected'); persist();
        });
      });
    });
    const err = document.createElement('div');
    err.style.cssText='color:#c0392b;font-size:13px;margin-top:10px;';
    card.appendChild(err);
    const btn = document.createElement('button');
    btn.className='btn'; btn.textContent='Continue'; btn.style.marginTop='10px';
    btn.addEventListener('click', ()=>{
      if (state.paqMother.some(v=>v===null) || state.paqFather.some(v=>v===null)) {
        err.textContent='Please rate every item for both mother and father.'; return;
      }
      function scoreParent(arr) {
        let resp=0, ctrl=0;
        arr.forEach((v,idx)=>{ if ((idx+1)%2===1) resp+=v; else ctrl+=v; });
        return {responsiveness:resp, control:ctrl};
      }
      const m = scoreParent(state.paqMother), f = scoreParent(state.paqFather);
      state.log.paq_completed_at = Date.now();
      state.log.paq_scores = {
        mother_responsiveness:m.responsiveness, mother_control:m.control,
        father_responsiveness:f.responsiveness, father_control:f.control,
        parental_responsiveness:m.responsiveness+f.responsiveness,
        parental_control:m.control+f.control
      };
      state.screen='stai1'; persist(); render();
    });
    card.appendChild(btn);
  }

  function renderSTAI(card, key, title, nextScreen) {
    card.innerHTML = `<h2>${title}</h2>
      <div class="flag">PLACEHOLDER ITEMS ONLY. The actual STAI is copyrighted and licensed through Mind Garden. Replace these items with the licensed STAI-Y1/Y2 text before real data collection.</div>`;
    STAI_ITEMS.forEach((text,i)=>{
      const block = document.createElement('div');
      block.style.marginBottom = '14px';
      block.innerHTML = `<div>${i+1}. ${text}</div>
        <div class="likert" data-i="${i}">${LIKERT_STAI.map((l,v)=>`<button data-v="${v}">${l}</button>`).join('')}</div>`;
      card.appendChild(block);
    });
    card.querySelectorAll('.likert').forEach(group=>{
      const i = +group.dataset.i;
      group.querySelectorAll('button').forEach(btn=>{
        btn.addEventListener('click', ()=>{
          state[key][i] = +btn.dataset.v;
          group.querySelectorAll('button').forEach(b=>b.classList.remove('selected'));
          btn.classList.add('selected'); persist();
        });
      });
    });
    const err = document.createElement('div');
    err.style.cssText='color:#c0392b;font-size:13px;margin-top:4px;';
    card.appendChild(err);
    const btn = document.createElement('button');
    btn.className='btn'; btn.textContent='Continue'; btn.style.marginTop='10px';
    btn.addEventListener('click', ()=>{
      if (state[key].some(v=>v===null)) { err.textContent='Please answer every item.'; return; }
      // Buttons are 0-indexed (0-3) for "Not at all".."Very much so", but the
      // scoring key weights responses 1-4. Reverse-keyed items score 4 minus
      // that weight (i.e. 4-v, since v already equals weight-1); forward-keyed
      // items score the weight itself (v+1). A 20-item Form Y-1 total should
      // now fall in the standard 20-80 range.
      const vals = state[key].map((v,i)=> STAI_REVERSE[i] ? (4-v) : (v+1));
      state.log[key+'_completed_at'] = Date.now();
      state.log[key+'_score'] = vals.reduce((a,b)=>a+b,0);
      state.screen = nextScreen; persist(); render();
    });
    card.appendChild(btn);
  }

  function renderVideo(card) {
    card.innerHTML = `
      <h2>Video</h2>
      <div class="flag">If the video does not play here, this is a preview-sandbox limitation, not a broken file. Download this HTML file together with the video file into the same folder and open the HTML file directly in a browser, or host the video online and update VIDEO_SRC near the top of the script.</div>
      <p>Please watch the entire video below with sound on. You cannot continue until it finishes.</p>
      <video id="stimVideo" controls>
        <source src="${VIDEO_SRC}" type="video/mp4">
        Your browser does not support embedded video.
      </video>
      <button class="btn" id="videoDone" style="margin-top:14px;" disabled>Continue</button>
      <p class="note" id="videoNote">Waiting for video to finish...</p>
    `;
    const vid = card.querySelector('#stimVideo');
    const btn = card.querySelector('#videoDone');
    const noteEl = card.querySelector('#videoNote');
    state.log.video_shown_at = Date.now();
    vid.addEventListener('ended', ()=>{
      btn.disabled = false;
      noteEl.textContent = 'Video complete - you may continue.';
      state.log.video_ended_at = Date.now();
      persist();
    });
    btn.addEventListener('click', ()=>{
      state.log.video_continue_clicked_at = Date.now();
      state.screen='stai2'; persist(); render();
    });
  }

  function renderChoice(card) {
    card.innerHTML = `
      <h2>How would you like to reflect on the video?</h2>
      <p>You can talk to an AI companion about the video, or write a private note about it instead.</p>
      <div style="display:flex;gap:12px;margin-top:16px;">
        <button class="btn" id="chooseAI">Talk to AI companion</button>
        <button class="btn btn-secondary" id="chooseNote">Write a note</button>
      </div>
    `;
    card.querySelector('#chooseAI').addEventListener('click', ()=>{
      state.condition='ai'; state.log.condition_chosen_at=Date.now();
      state.screen='ai_chat'; persist(); render();
    });
    card.querySelector('#chooseNote').addEventListener('click', ()=>{
      state.condition='note'; state.log.condition_chosen_at=Date.now();
      state.screen='note'; persist(); render();
    });
  }

  function renderChat(card) {
    card.innerHTML = `
      <h2>AI companion</h2>
      <div class="chatbox" id="chatbox"></div>
      <div class="chatinput">
        <input type="text" id="chatInput" placeholder="Type a message..."/>
        <button class="btn" id="sendBtn">Send</button>
      </div>
      <button class="btn btn-secondary" id="endChat" style="margin-top:10px;">I'm done talking</button>
    `;
    const box = card.querySelector('#chatbox');
    function paint(){ box.innerHTML = state.chatLog.map(m=>`<div class="msg ${m.role==='user'?'user':'ai'}">${m.text}</div>`).join(''); box.scrollTop=box.scrollHeight; }
    paint();
    async function send() {
      const input = card.querySelector('#chatInput');
      const text = input.value.trim();
      if (!text) return;
      input.value='';
      state.chatLog.push({role:'user', text, t:Date.now()});
      paint(); persist();
      const apiMessages = state.chatLog.map(m=>({role: m.role==='user'?'user':'assistant', content:m.text}));
      try {
        // Calls your own Cloudflare Worker (which safely holds the API key)
        // instead of Anthropic directly - this is what makes it work outside
        // the chat preview, without ever exposing your key to participants.
        const resp = await fetch("https://mute-wave-9fad.kaur040797.workers.dev", {
          method:"POST", headers:{"Content-Type":"application/json"},
          body: JSON.stringify({ system: AI_SYSTEM_PROMPT, messages: apiMessages })
        });
        const data = await resp.json();
        const reply = (data.content||[]).map(c=>c.text||'').join('').trim() || "I'm here - go on.";
        state.chatLog.push({role:'ai', text: reply, t:Date.now()});
      } catch(e) {
        state.chatLog.push({role:'ai', text:"(connection issue - message not delivered)", t:Date.now()});
      }
      paint(); persist();
    }
    card.querySelector('#sendBtn').addEventListener('click', send);
    card.querySelector('#chatInput').addEventListener('keydown', e=>{ if(e.key==='Enter') send(); });
    card.querySelector('#endChat').addEventListener('click', ()=>{
      state.log.chat_ended_at = Date.now();
      state.screen='debrief'; persist(); render();
    });
  }

  function renderNote(card) {
    card.innerHTML = `
      <h2>Write a note</h2>
      <p>Write privately about how the video made you feel.</p>
      <textarea id="noteText" placeholder="Write here..."></textarea>
      <div style="color:#c0392b;font-size:13px;margin-top:4px;" id="noteErr"></div>
      <button class="btn" id="noteDone" style="margin-top:10px;">Done</button>
    `;
    card.querySelector('#noteDone').addEventListener('click', ()=>{
      const val = card.querySelector('#noteText').value.trim();
      if (!val) { card.querySelector('#noteErr').textContent='Please write something before continuing.'; return; }
      state.note = val;
      state.log.note_completed_at = Date.now();
      state.screen='debrief'; persist(); render();
    });
  }

  // ============ GOOGLE SHEETS STORAGE ============
  // Sends the final, complete set of scored data to your Google Sheet via
  // the Apps Script web app URL below. This is separate from the local
  // window.storage backup - this is the one that actually gives you a
  // permanent, shared spreadsheet of every participant's results.
  const GOOGLE_SHEET_URL = "https://script.google.com/macros/s/AKfycbzuKNgM93uEwRStSOV4Dr6HQdA7I2cOjRrKXHLQ8dcDmP5cISTKz0c0XCc9UTZYecba/exec";

  async function sendToGoogleSheet() {
    const payload = {
      session_id: SID,
      condition: state.condition || '',
      uses_ai: state.usesAI,
      ryff_total: state.log.ryff_total || '',
      ryff_autonomy: (state.log.ryff_subscales && state.log.ryff_subscales.Autonomy) || '',
      ryff_environmental_mastery: (state.log.ryff_subscales && state.log.ryff_subscales.EnvironmentalMastery) || '',
      ryff_personal_growth: (state.log.ryff_subscales && state.log.ryff_subscales.PersonalGrowth) || '',
      ryff_positive_relations: (state.log.ryff_subscales && state.log.ryff_subscales.PositiveRelations) || '',
      ryff_purpose_in_life: (state.log.ryff_subscales && state.log.ryff_subscales.PurposeInLife) || '',
      ryff_self_acceptance: (state.log.ryff_subscales && state.log.ryff_subscales.SelfAcceptance) || '',
      paq_mother_responsiveness: (state.log.paq_scores && state.log.paq_scores.mother_responsiveness) || '',
      paq_mother_control: (state.log.paq_scores && state.log.paq_scores.mother_control) || '',
      paq_father_responsiveness: (state.log.paq_scores && state.log.paq_scores.father_responsiveness) || '',
      paq_father_control: (state.log.paq_scores && state.log.paq_scores.father_control) || '',
      stai1_score: state.log.stai1_score || '',
      stai2_score: state.log.stai2_score || '',
      note_text: state.note || '',
      chat_transcript: (state.chatLog||[]).map(m=>`[${m.role}] ${m.text}`).join(' | '),
      consented_at: state.log.consented_at || '',
      session_ended_at: state.log.session_ended_at || ''
    };
    try {
      await fetch(GOOGLE_SHEET_URL, {
        method: 'POST',
        mode: 'no-cors', // Apps Script doesn't return CORS headers, but the write still goes through
        headers: {'Content-Type': 'text/plain'},
        body: JSON.stringify(payload)
      });
    } catch(e) {
      console.error('Google Sheet submission failed:', e);
    }
  }

  function renderDebrief(card) {
    state.log.session_ended_at = Date.now();
    persist();
    card.innerHTML = `
      <h2>Debrief</h2>
      <p>Thank you for taking part. The video was selected to bring on a brief, mild emotional response, as is standard in stress and emotion research. Any effect on your mood should be short-lived.</p>
      <p>Your responses have been recorded anonymously under session ID <code>${SID}</code>.</p>
      <label style="display:flex;gap:8px;align-items:center;margin-top:12px;">
        <input type="checkbox" id="confirmUnderstand"/> I understand, and I consent to my data being used in this study.
      </label>
      <button class="btn" id="finishBtn" style="margin-top:14px;" disabled>Finish</button>
      <p class="note" style="margin-top:16px;">If anything in this study brought up difficult feelings, please consider speaking to a counselor or someone you trust.</p>
    `;
    card.querySelector('#confirmUnderstand').addEventListener('change', e=>{ card.querySelector('#finishBtn').disabled = !e.target.checked; });
    card.querySelector('#finishBtn').addEventListener('click', async ()=>{
      state.log.data_use_confirmed_at = Date.now();
      persist();
      card.innerHTML = '<h2>Saving your responses...</h2>';
      await sendToGoogleSheet();
      card.innerHTML = '<h2>Session complete</h2><p>You may close this window now.</p>';
    });
  }

  render();

  // ============ RESEARCHER DATA EXPORT ============
  // Pulls every saved session out of storage and compiles it into a
  // downloadable CSV - one row per participant, with every scored
  // instrument, the condition assigned, the full chat transcript or
  // note text, and key timestamps. This is how you get usable data out
  // for SPSS/Excel/R while you're still testing without a full backend.
  const exportBar = document.createElement('div');
  exportBar.className = 'exportbar';
  exportBar.innerHTML = `<button id="exportBtn">Export all collected data (researcher)</button>`;
  document.body.appendChild(exportBar);

  document.getElementById('exportBtn').addEventListener('click', async ()=>{
    try {
      const listResult = await window.storage.list('session:', false);
      const keys = (listResult && listResult.keys) || [];
      if (!keys.length) { alert('No sessions found in storage yet.'); return; }

      const headerSet = new Set(['session_id']);
      const parsed = [];

      for (const k of keys) {
        try {
          const r = await window.storage.get(k, false);
          const s = JSON.parse(r.value);
          const flat = { session_id: k.replace('session:','') };
          flat.uses_ai = s.usesAI;
          flat.condition = s.condition;
          flat.ryff_total = s.log && s.log.ryff_total;
          if (s.log && s.log.ryff_subscales) {
            Object.entries(s.log.ryff_subscales).forEach(([sub,val])=>{ flat['ryff_'+sub]=val; });
          }
          if (s.log && s.log.paq_scores) {
            Object.entries(s.log.paq_scores).forEach(([k2,val])=>{ flat['paq_'+k2]=val; });
          }
          flat.stai1_score = s.log && s.log.stai1_score;
          flat.stai2_score = s.log && s.log.stai2_score;
          flat.note_text = s.note || '';
          flat.chat_transcript = (s.chatLog||[]).map(m=>`[${m.role}] ${m.text}`).join(' | ');
          flat.consented_at = s.log && s.log.consented_at;
          flat.video_shown_at = s.log && s.log.video_shown_at;
          flat.video_ended_at = s.log && s.log.video_ended_at;
          flat.session_ended_at = s.log && s.log.session_ended_at;
          Object.keys(flat).forEach(h=>headerSet.add(h));
          parsed.push(flat);
        } catch(e) { console.error('failed to parse', k, e); }
      }

      const headers = Array.from(headerSet);
      const csvRows = [headers.join(',')];
      parsed.forEach(flat=>{
        const row = headers.map(h=>{
          let v = flat[h] !== undefined ? flat[h] : '';
          v = String(v).replace(/"/g,'""');
          return `"${v}"`;
        });
        csvRows.push(row.join(','));
      });
      const csv = csvRows.join('\n');
      const blob = new Blob([csv], {type:'text/csv'});
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = 'study_data_export.csv';
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      URL.revokeObjectURL(url);
    } catch(e) {
      alert('Export failed: ' + e.message);
    }
  });
})();
</script>
